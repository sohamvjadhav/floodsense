# Render free-tier deployment for the FloodSense API.
# Model artifacts (flood_gru_v1.pt, norm_stats.json, calibration.json) are
# committed to the repo so the service can serve inference without training.
services:
  - type: web
    name: floodsense-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m src.data.build_dataset --years 5  # replay feature needs the historical CSV
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: floodsense-db
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: REFRESH_HOURS
        value: "3"

databases:
  - name: floodsense-db
    plan: free
